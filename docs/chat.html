<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chat</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="chat.css">
</head>

<body>

<div class="app">

  <!-- HEADER -->
  <div class="header">
    <div class="avatar" id="myAvatar"></div>
    <div class="me">
      <div id="myUsername">@user</div>
      <small>online</small>
    </div>
  </div>

  <!-- SEARCH -->
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Search @username">
  </div>

  <!-- CHAT LIST -->
  <div class="chat-list" id="chatList">
    <!-- users appear here -->
  </div>

</div>

<script src="chat.js"></script>
</body>
</html>
