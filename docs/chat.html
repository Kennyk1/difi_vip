<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chat - FXC Bot Looters</title>
  <style>
    :root {
      --primary: #FF3B3B;
      --primary-dark: #CC2E2E;
      --gray-light: #A5B4FC;
      --bg-dark: #121229;
      --text-light: #E0E7FF;
      --unread-bg: #FF3B3B;
    }
    body {
      margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg-dark); color: var(--text-light);
      display: flex; flex-direction: column; height: 100vh;
    }
    header {
      background: rgba(15, 23, 42, 0.8);
      padding: 15px 20px;
      display: flex; align-items: center; justify-content: space-between;
      color: var(--primary);
      font-weight: 700;
      font-size: 1.3em;
      user-select: none;
      box-shadow: 0 0 15px var(--primary);
    }
    .search-container {
      padding: 10px 20px;
      background: rgba(15, 23, 42, 0.9);
      box-shadow: inset 0 0 15px var(--primary);
    }
    #searchInput {
      width: 100%;
      padding: 12px 16px;
      border-radius: 12px;
      border: none;
      font-size: 1em;
      background: #252f4a;
      color: var(--text-light);
      box-shadow: 0 0 10px var(--primary);
      transition: box-shadow 0.3s ease;
    }
    #searchInput::placeholder {
      color: var(--gray-light);
    }
    #searchInput:focus {
      outline: none;
      box-shadow: 0 0 20px var(--primary);
    }
    main {
      flex-grow: 1;
      overflow-y: auto;
      background: #181b2f;
      box-shadow: inset 0 0 30px #FF3B3B33;
    }
    ul.chat-list {
      list-style: none;
      margin: 0; padding: 0;
    }
    li.chat-item {
      display: flex;
      align-items: center;
      padding: 14px 20px;
      border-bottom: 1px solid #2a2f55;
      cursor: pointer;
      transition: background 0.2s, box-shadow 0.3s;
    }
    li.chat-item:hover {
      background: #2a2f55;
      box-shadow: 0 0 10px var(--primary);
    }
    .avatar {
      flex-shrink: 0;
      width: 48px; height: 48px;
      border-radius: 50%;
      background: #444a7a;
      color: var(--text-light);
      font-size: 1.5em;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 15px;
      user-select: none;
      box-shadow: 0 0 8px var(--primary);
    }
    .avatar img {
      width: 100%; height: 100%;
      border-radius: 50%;
      object-fit: cover;
    }
    .chat-info {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .chat-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
    }
    .username {
      font-weight: 700;
      font-size: 1.1em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-transform: capitalize;
    }
    .last-time {
      font-size: 0.8em;
      color: var(--gray-light);
      white-space: nowrap;
    }
    .last-message {
      font-size: 0.95em;
      color: var(--gray-light);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .unread-count {
      background: var(--unread-bg);
      color: white;
      font-weight: 700;
      font-size: 0.8em;
      min-width: 22px;
      height: 22px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-left: 12px;
      user-select: none;
      box-shadow: 0 0 8px var(--unread-bg);
    }
    .error-msg {
      padding: 20px;
      text-align: center;
      color: var(--primary);
      font-weight: 700;
    }
    /* Responsive */
    @media (max-width: 600px) {
      .avatar {
        width: 40px; height: 40px;
        font-size: 1.2em;
        margin-right: 10px;
      }
      .username {
        font-size: 1em;
      }
      .last-message {
        font-size: 0.85em;
      }
    }
  </style>
</head>
<body>
  <header>
    FXC Bot Looters Chat
  </header>

  <div class="search-container">
    <input type="search" id="searchInput" placeholder="Search users by username or @handle" autocomplete="off" disabled />
  </div>

  <main>
    <ul class="chat-list" id="chatList">
      <li class="error-msg" id="statusMsg">Verifying user...</li>
    </ul>
  </main>

  <script>
    const API_BASE = "https://sample-api-1-ryj7.onrender.com";
    const token = localStorage.getItem("auth_token"); // Adjust if you store your token differently

    const chatList = document.getElementById('chatList');
    const searchInput = document.getElementById('searchInput');
    const statusMsg = document.getElementById('statusMsg');

    // Utility: format timestamp nicely
    function formatTime(isoString) {
      const date = new Date(isoString);
      const now = new Date();
      const diffMs = now - date;
      const diffDays = diffMs / (1000 * 60 * 60 * 24);

      if (diffDays < 1) {
        return date.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
      } else if (diffDays < 7) {
        return date.toLocaleDateString([], {weekday: 'short'});
      } else {
        return date.toLocaleDateString();
      }
    }

    // Get username from email
    function getUsername(email) {
      return email.split('@')[0];
    }

    // Create avatar element
    function createAvatar(user) {
      const div = document.createElement('div');
      div.className = 'avatar';
      if (user.avatar_url) {
        const img = document.createElement('img');
        img.src = user.avatar_url;
        img.alt = getUsername(user.email);
        div.appendChild(img);
      } else {
        const letter = getUsername(user.email).charAt(0).toUpperCase();
        div.textContent = letter;
      }
      return div;
    }

    // Create chat item DOM
    function createChatItem(chat) {
      const li = document.createElement('li');
      li.className = 'chat-item';
      li.setAttribute('data-user-id', chat.userId);

      li.appendChild(createAvatar(chat));

      const info = document.createElement('div');
      info.className = 'chat-info';

      const header = document.createElement('div');
      header.className = 'chat-header';

      const username = document.createElement('div');
      username.className = 'username';
      username.textContent = getUsername(chat.email);

      const lastTime = document.createElement('div');
      lastTime.className = 'last-time';
      lastTime.textContent = formatTime(chat.lastTimestamp);

      header.appendChild(username);
      header.appendChild(lastTime);

      const lastMsg = document.createElement('div');
      lastMsg.className = 'last-message';
      lastMsg.textContent = chat.lastMessage;

      info.appendChild(header);
      info.appendChild(lastMsg);

      li.appendChild(info);

      if (chat.unreadCount > 0) {
        const unread = document.createElement('div');
        unread.className = 'unread-count';
        unread.textContent = chat.unreadCount;
        li.appendChild(unread);
      }

      li.addEventListener('click', () => {
        window.location.href = `userschat.html?userId=${chat.userId}`;
      });

      return li;
    }

    // Render chat list
    function renderChats(list) {
      chatList.innerHTML = '';
      if (!list.length) {
        chatList.innerHTML = '<li class="error-msg">No chats found</li>';
        return;
      }
      list.forEach(chat => {
        chatList.appendChild(createChatItem(chat));
      });
    }

    // Verify user auth on load
    async function verifyUser() {
      if (!token) {
        statusMsg.textContent = "Not logged in. Redirecting to login...";
        setTimeout(() => window.location.href = "login.html", 2000);
        return false;
      }
      try {
        const res = await fetch(`${API_BASE}/auth/verify`, {
          headers: { Authorization: `Bearer ${token}` }
        });
        if (!res.ok) throw new Error("Verification failed");
        const data = await res.json();
        if (data.success) {
          statusMsg.style.display = 'none';
          searchInput.disabled = false;
          return true;
        } else {
          statusMsg.textContent = "Unauthorized. Redirecting to login...";
          setTimeout(() => window.location.href = "login.html", 2000);
          return false;
        }
      } catch (e) {
        statusMsg.textContent = "Error verifying user. Please try again.";
        console.error(e);
        return false;
      }
    }

    // Fetch recent chats: get distinct users you chatted with and last message info
    async function fetchRecentChats() {
      // We don't have a dedicated recent chats API,
      // so we must fetch all messages involving current user and group by partner.

      // Get current user ID from token payload (decode without verification)
      function parseUserIdFromToken(token) {
        try {
          const base64Url = token.split('.')[1];
          const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
          const jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
            return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
          }).join(''));
          return JSON.parse(jsonPayload).user_id;
        } catch {
          return null;
        }
      }

      const userId = parseUserIdFromToken(token);
      if (!userId) {
        statusMsg.textContent = "Invalid token. Please login again.";
        return [];
      }

      try {
        // Fetch all messages where user is sender or recipient
        const res = await fetch(`${API_BASE}/chat/history/${userId}`, {
          headers: { Authorization: `Bearer ${token}` }
        });
        if (!res.ok) throw new Error("Failed to fetch chat history");
        const messages = await res.json();

        // Group messages by chat partner (other user)
        const chatsMap = new Map();

        messages.forEach(msg => {
          const partnerId = msg.sender_id === userId ? msg.recipient_id : msg.sender_id;
          if (!chatsMap.has(partnerId)) {
            chatsMap.set(partnerId, {
              userId: partnerId,
              lastMessage: msg.content,
              lastTimestamp: msg.created_at,
              unreadCount: 0 // We'll calculate unread count separately if you have that data
            });
          } else {
            // Update last message if newer
            if (new Date(msg.created_at) > new Date(chatsMap.get(partnerId).lastTimestamp)) {
              chatsMap.get(partnerId).lastMessage = msg.content;
              chatsMap.get(partnerId).lastTimestamp = msg.created_at;
            }
          }
        });

        // For each partner, fetch user info (email, avatar_url, bio)
        const chats = [];
        for (const [partnerId, chat] of chatsMap.entries()) {
          const userRes = await fetch(`${API_BASE}/chat/search?q=`, {
            headers: { Authorization: `Bearer ${token}` }
          });
          // Your /chat/search requires query, so we fetch user by id below instead:
          const userInfoRes = await fetch(`${API_BASE}/user/profile/${partnerId}`, {
            headers: { Authorization: `Bearer ${token}` }
          });
          let userInfo = null;
          if (userInfoRes.ok) {
            userInfo = await userInfoRes.json();
          }
          // Fallback if no user info found
          chats.push({
            userId: partnerId,
            email: userInfo?.email || 'unknown@example.com',
            avatar_url: userInfo?.avatar_url || null,
            lastMessage: chat.lastMessage,
            lastTimestamp: chat.lastTimestamp,
            unreadCount: chat.unreadCount || 0
          });
        }

        return chats;
      } catch (e) {
        console.error("Error fetching recent chats:", e);
        return [];
      }
    }

    // Search users via API
    async function searchUsers(query) {
      if (!token) return [];
      try {
        const res = await fetch(`${API_BASE}/chat/search?q=${encodeURIComponent(query)}`, {
          headers: { Authorization: `Bearer ${token}` }
        });
        if (!res.ok) throw new Error("Search request failed");
        const data = await res.json();
        return data;
      } catch (e) {
        console.error("Search error:", e);
        return [];
      }
    }

    // Render chats to UI
    function renderChats(list) {
      chatList.innerHTML = '';
      if (!list.length) {
        chatList.innerHTML = '<li class="error-msg">No chats found</li>';
        return;
      }
      list.forEach(chat => {
        chatList.appendChild(createChatItem(chat));
      });
    }

    // Debounce helper
    function debounce(fn, delay) {
      let timeout;
      return function(...args) {
        clearTimeout(timeout);
        timeout = setTimeout(() => fn.apply(this, args), delay);
      };
    }

    // Initialize page
    (async () => {
      const verified = await verifyUser();
      if (!verified) return;

      // Load recent chats from messages grouped by partner
      statusMsg.textContent = "Loading chats...";
      try {
        const recentChats = await fetchRecentChats();
        renderChats(recentChats);
      } catch {
        renderChats([]);
      }

      // Enable search box
      searchInput.disabled = false;

      // Search input handler (debounced)
      const onSearch = debounce(async () => {
        const q = searchInput.value.trim();
        if (!q) {
          // Reload recent chats if no query
          const recentChats = await fetchRecentChats();
          renderChats(recentChats);
          return;
        }
        const results = await searchUsers(q);
        // Add username field from email for display
        results.forEach(u => {
          u.username = u.email.split('@')[0];
          u.userId = u.id || u.userId || u.id;
        });
        renderChats(results);
      }, 300);

      searchInput.addEventListener('input', onSearch);
    })();
  </script>
</body>
</html>
