<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat</title>
<style>
/* ================== RESET & BASE ================== */
* { box-sizing: border-box; margin:0; padding:0; font-family: Arial, sans-serif; }
body { height:100vh; display:flex; flex-direction:column; background:#f0f2f5; }

/* ================== LAYOUT ================== */
#app { flex:1; display:flex; overflow:hidden; }
#sidebar { width:300px; background:#fff; border-right:1px solid #ddd; display:flex; flex-direction:column; }
#search-container { padding:10px; border-bottom:1px solid #ddd; }
#search-input { width:100%; padding:8px; border:1px solid #ccc; border-radius:4px; }
#contacts { flex:1; overflow-y:auto; }
.contact { display:flex; align-items:center; padding:10px; cursor:pointer; border-bottom:1px solid #eee; transition:background 0.2s; }
.contact:hover { background:#f5f5f5; }
.contact img { width:40px; height:40px; border-radius:50%; margin-right:10px; object-fit:cover; }
.contact .info { display:flex; flex-direction:column; }
.contact .username { font-weight:bold; }
.contact .bio { font-size:12px; color:#666; }

/* ================== CHAT WINDOW ================== */
#chat-window { flex:1; display:flex; flex-direction:column; background:#e5ddd5; }
#messages { flex:1; overflow-y:auto; padding:10px; }
.message { margin-bottom:10px; max-width:70%; padding:8px 12px; border-radius:10px; word-wrap:break-word; position:relative; }
.message.self { background:#dcf8c6; margin-left:auto; text-align:right; }
.message.other { background:#fff; margin-right:auto; text-align:left; }
.message img, .message video { max-width:200px; border-radius:10px; margin-top:5px; }

/* ================== INPUT ================== */
#chat-input-container { display:flex; padding:10px; background:#fff; border-top:1px solid #ddd; }
#chat-input { flex:1; padding:8px; border:1px solid #ccc; border-radius:4px; }
#file-input { display:none; }
#send-btn { padding:8px 12px; margin-left:5px; border:none; background:#007bff; color:#fff; border-radius:4px; cursor:pointer; }

/* ================== RESPONSIVE ================== */
@media (max-width:768px){
  #app { flex-direction:column; }
  #sidebar { width:100%; height:150px; display:flex; flex-direction:column; }
  #chat-window { flex:1; }
}
</style>
</head>
<body>

<div id="app">
  <!-- Sidebar / Contacts -->
  <div id="sidebar">
    <div id="search-container">
      <input type="text" id="search-input" placeholder="Search users...">
    </div>
    <div id="contacts"></div>
  </div>

  <!-- Chat Window -->
  <div id="chat-window">
    <div id="messages"></div>
    <div id="chat-input-container">
      <input type="text" id="chat-input" placeholder="Type a message...">
      <input type="file" id="file-input" accept="image/*,video/*">
      <button id="send-btn">Send</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/supabase.min.js"></script>
<script>
// ================== CONFIG ==================
const API_URL = "https://sample-api-1-ryj7.onrender.com";
const supabaseUrl = "https://vvkvowtrzmekbdresegf.supabase.co";
const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ2a3Zvd3Ryem1la2JkcmVzZWdmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY3MDQyMzIsImV4cCI6MjA4MjI4MDIzMn0.ge6YMn01wM_oEm1wT4tx1mUBxwXqUHiKZIQdCIC1-OM";
const supabase = supabase.createClient(supabaseUrl, supabaseKey);

let token = localStorage.getItem("token");
let currentUser = null;
let currentChatPartner = null;

// ================== UTILS ==================
function authHeader() {
  return { "Authorization": "Bearer " + token };
}

function createContactElement(user) {
  const div = document.createElement("div");
  div.className = "contact";
  div.dataset.id = user.id;

  const img = document.createElement("img");
  img.src = user.avatar_url || `https://ui-avatars.com/api/?name=${user.username}`;
  div.appendChild(img);

  const info = document.createElement("div");
  info.className = "info";
  const name = document.createElement("div");
  name.className = "username"; name.textContent = user.username;
  const bio = document.createElement("div");
  bio.className = "bio"; bio.textContent = user.bio || "";
  info.appendChild(name); info.appendChild(bio);
  div.appendChild(info);

  div.addEventListener("click", () => {
    currentChatPartner = user;
    loadChatHistory(user.id);
  });

  return div;
}

function addMessageToChat(msg, self=false) {
  const div = document.createElement("div");
  div.className = "message " + (self ? "self" : "other");
  div.innerHTML = msg.content || "";
  if(msg.msg_type==="image") div.innerHTML = `<img src="${msg.file_url}">`;
  if(msg.msg_type==="video") div.innerHTML = `<video src="${msg.file_url}" controls></video>`;
  document.getElementById("messages").appendChild(div);
  div.scrollIntoView({behavior:"smooth"});
}

// ================== AUTH VERIFY ==================
async function verifyAuth() {
  if(!token) return alert("Not logged in");
  const res = await fetch(`${API_URL}/verify`, {
    method:"POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({token})
  });
  const data = await res.json();
  if(data.success) currentUser = {id:data.user_id,email:data.email};
  else { alert("Invalid token"); localStorage.removeItem("token"); }
}

// ================== SEARCH ==================
document.getElementById("search-input").addEventListener("input", async e=>{
  const q = e.target.value;
  if(!q) return;
  const res = await fetch(`${API_URL}/search?q=${encodeURIComponent(q)}`, { headers: authHeader() });
  const users = await res.json();
  const contactsDiv = document.getElementById("contacts");
  contactsDiv.innerHTML = "";
  users.forEach(u=>contactsDiv.appendChild(createContactElement(u)));
});

// ================== CHAT HISTORY ==================
async function loadChatHistory(partnerId) {
  if(!partnerId) return;
  document.getElementById("messages").innerHTML = "";
  const res = await fetch(`${API_URL}/history/${partnerId}`, { headers: authHeader() });
  const msgs = await res.json();
  msgs.forEach(m=>addMessageToChat(m, m.sender_id===currentUser.id));
}

// ================== SEND MESSAGE ==================
document.getElementById("send-btn").addEventListener("click", async ()=>{
  if(!currentChatPartner) return alert("Select a contact");
  const input = document.getElementById("chat-input");
  const fileInput = document.getElementById("file-input");
  const form = new FormData();
  form.append("recipient_id", currentChatPartner.id);
  form.append("content", input.value);
  if(fileInput.files[0]) form.append("file", fileInput.files[0]);

  const res = await fetch(`${API_URL}/send`, {
    method:"POST",
    headers: { "Authorization":"Bearer "+token },
    body: form
  });
  const data = await res.json();
  if(data.success) addMessageToChat({content:input.value,file_url:data.data?.file_url,msg_type:data.data?.msg_type}, true);
  input.value = ""; fileInput.value = "";
});

// ================== SUPABASE REALTIME ==================
async function subscribeRealtime() {
  supabase.channel("public:messages")
    .on("postgres_changes", { event: "INSERT", schema: "public", table: "messages" }, payload=>{
      const msg = payload.new;
      if(currentUser && (msg.sender_id===currentUser.id || msg.recipient_id===currentUser.id)) {
        if(!currentChatPartner || (msg.sender_id===currentChatPartner.id || msg.recipient_id===currentChatPartner.id))
          addMessageToChat(msg, msg.sender_id===currentUser.id);
      }
    }).subscribe();
}

// ================== INIT ==================
(async()=>{
  await verifyAuth();
  await subscribeRealtime();
})();
</script>
</body>
</html>
