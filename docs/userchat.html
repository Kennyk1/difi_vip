<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat - FXC Bot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #0a0e27;
            color: #e4e6eb;
            height: 100vh;
            overflow: hidden;
        }

        .chat-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 1200px;
            margin: 0 auto;
            background: #111827;
        }

        /* Header */
        .chat-header {
            padding: 15px 20px;
            background: #1a1f35;
            border-bottom: 1px solid #2d3548;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .back-btn {
            background: none;
            border: none;
            color: #4f46e5;
            font-size: 24px;
            cursor: pointer;
            padding: 5px;
        }

        .header-avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 18px;
            cursor: pointer;
        }

        .header-avatar img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .header-info {
            flex: 1;
            cursor: pointer;
        }

        .header-username {
            font-weight: 600;
            font-size: 16px;
            color: #fff;
        }

        .header-status {
            font-size: 13px;
            color: #6b7280;
        }

        /* Messages Area */
        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #0f1419;
        }

        .message {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .message.sent {
            flex-direction: row-reverse;
        }

        .message-avatar {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 14px;
            flex-shrink: 0;
        }

        .message-avatar img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .message-content {
            max-width: 60%;
        }

        .message-bubble {
            padding: 10px 15px;
            border-radius: 12px;
            margin-bottom: 4px;
            word-wrap: break-word;
        }

        .message.received .message-bubble {
            background: #1a1f35;
            color: #e4e6eb;
        }

        .message.sent .message-bubble {
            background: #4f46e5;
            color: white;
        }

        .message-image, .message-video {
            max-width: 300px;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 4px;
        }

        .message-image img {
            width: 100%;
            display: block;
        }

        .message-video video {
            width: 100%;
            display: block;
        }

        .message-time {
            font-size: 11px;
            color: #6b7280;
            padding: 0 5px;
        }

        .message.sent .message-time {
            text-align: right;
        }

        .mention {
            color: #60a5fa;
            cursor: pointer;
            font-weight: 600;
        }

        .mention:hover {
            text-decoration: underline;
        }

        /* Input Area */
        .input-area {
            padding: 15px 20px;
            background: #1a1f35;
            border-top: 1px solid #2d3548;
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        .attach-btn {
            background: none;
            border: none;
            color: #6b7280;
            font-size: 24px;
            cursor: pointer;
            padding: 8px;
            transition: color 0.2s;
        }

        .attach-btn:hover {
            color: #4f46e5;
        }

        .message-input {
            flex: 1;
            background: #0f1419;
            border: 1px solid #2d3548;
            border-radius: 24px;
            padding: 12px 20px;
            color: #e4e6eb;
            font-size: 15px;
            outline: none;
            resize: none;
            max-height: 120px;
            font-family: inherit;
        }

        .message-input:focus {
            border-color: #4f46e5;
        }

        .send-btn {
            background: #4f46e5;
            border: none;
            color: white;
            font-size: 20px;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .send-btn:hover {
            background: #4338ca;
        }

        .send-btn:disabled {
            background: #2d3548;
            cursor: not-allowed;
        }

        /* File Preview */
        .file-preview {
            padding: 10px 20px;
            background: #1a1f35;
            border-top: 1px solid #2d3548;
            display: none;
        }

        .file-preview.show {
            display: block;
        }

        .preview-item {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #0f1419;
            padding: 10px;
            border-radius: 8px;
        }

        .preview-thumbnail {
            width: 60px;
            height: 60px;
            border-radius: 6px;
            object-fit: cover;
        }

        .preview-info {
            flex: 1;
        }

        .remove-file-btn {
            background: #ef4444;
            border: none;
            color: white;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
        }

        /* Loading */
        .loading {
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        .spinner {
            border: 3px solid #2d3548;
            border-top: 3px solid #4f46e5;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #1a1f35;
        }

        ::-webkit-scrollbar-thumb {
            background: #2d3548;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #3d4558;
        }

        input[type="file"] {
            display: none;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <!-- Header -->
        <div class="chat-header">
            <button class="back-btn" onclick="window.location.href='chat.html'">←</button>
            <div class="header-avatar" id="partnerAvatar" onclick="viewProfile()"></div>
            <div class="header-info" onclick="viewProfile()">
                <div class="header-username" id="partnerUsername">Loading...</div>
                <div class="header-status">Click to view profile</div>
            </div>
        </div>

        <!-- Messages Area -->
        <div class="messages-area" id="messagesArea">
            <div class="loading">
                <div class="spinner"></div>
            </div>
        </div>

        <!-- File Preview -->
        <div class="file-preview" id="filePreview"></div>

        <!-- Input Area -->
        <div class="input-area">
            <button class="attach-btn" onclick="document.getElementById('fileInput').click()">📎</button>
            <input type="file" id="fileInput" accept="image/*,video/*">
            <textarea class="message-input" id="messageInput" placeholder="Type a message..." rows="1"></textarea>
            <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
        </div>
    </div>

    <script>
        const API_URL = 'https://sample-api-1-ryj7.onrender.com';
        let token = localStorage.getItem('token');
        let currentUser = null;
        let partner = null;
        let selectedFile = null;

        if (!token) {
            window.location.href = 'login.html';
        }

        // Get partner info from localStorage
        const chatUserData = localStorage.getItem('currentChatUser');
        if (!chatUserData) {
            window.location.href = 'chat.html';
        }
        partner = JSON.parse(chatUserData);

        // Initialize
        async function init() {
            await getCurrentUser();
            await loadPartnerProfile();
            await loadMessages();
            startMessagePolling();
        }

        async function getCurrentUser() {
            try {
                const res = await fetch(`${API_URL}/auth/profile`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                if (data.success) {
                    currentUser = data.user;
                } else {
                    localStorage.removeItem('token');
                    window.location.href = 'login.html';
                }
            } catch (err) {
                console.error('Error fetching user:', err);
            }
        }

        async function loadPartnerProfile() {
            try {
                const res = await fetch(`${API_URL}/auth/userprofile/${partner.id}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                if (data.success) {
                    partner = {...partner, ...data.user};
                    updatePartnerHeader();
                }
            } catch (err) {
                console.error('Error loading partner:', err);
                updatePartnerHeader();
            }
        }

        function updatePartnerHeader() {
            document.getElementById('partnerUsername').textContent = `@${partner.username}`;
            const avatar = document.getElementById('partnerAvatar');
            if (partner.avatar_url) {
                avatar.innerHTML = `<img src="${partner.avatar_url}" alt="${partner.username}">`;
            } else {
                avatar.textContent = partner.username.charAt(0).toUpperCase();
            }
        }

        async function loadMessages() {
            try {
                const res = await fetch(`${API_URL}/chat/history/${partner.id}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const messages = await res.json();
                displayMessages(messages);
            } catch (err) {
                console.error('Error loading messages:', err);
                document.getElementById('messagesArea').innerHTML = '<div style="text-align: center; padding: 20px; color: #6b7280;">Failed to load messages</div>';
            }
        }

        function displayMessages(messages) {
            const container = document.getElementById('messagesArea');
            
            if (messages.length === 0) {
                container.innerHTML = '<div style="text-align: center; padding: 20px; color: #6b7280;">No messages yet. Start the conversation!</div>';
                return;
            }

            container.innerHTML = messages.map(msg => {
                const isSent = msg.sender_id === currentUser.id;
                const sender = isSent ? currentUser : partner;
                const content = processMessageContent(msg.content);
                
                let mediaHTML = '';
                if (msg.msg_type === 'image' && msg.file_url) {
                    mediaHTML = `<div class="message-image"><img src="${msg.file_url}" alt="Image"></div>`;
                } else if (msg.msg_type === 'video' && msg.file_url) {
                    mediaHTML = `<div class="message-video"><video src="${msg.file_url}" controls></video></div>`;
                }

                return `
                    <div class="message ${isSent ? 'sent' : 'received'}">
                        <div class="message-avatar">
                            ${sender.avatar_url ? `<img src="${sender.avatar_url}" alt="${sender.username}">` : sender.username.charAt(0).toUpperCase()}
                        </div>
                        <div class="message-content">
                            ${mediaHTML}
                            ${msg.content ? `<div class="message-bubble">${content}</div>` : ''}
                            <div class="message-time">${formatTime(msg.created_at)}</div>
                        </div>
                    </div>
                `;
            }).join('');

            scrollToBottom();
        }

        function processMessageContent(content) {
            // Convert @mentions to clickable links
            return content.replace(/@(\w+)/g, '<span class="mention" onclick="viewMentionedUser(\'$1\')">@$1</span>');
        }

        function viewMentionedUser(username) {
            // Search for user and view profile
            fetch(`${API_URL}/chat/search?q=${username}`, {
                headers: { 'Authorization': `Bearer ${token}` }
            })
            .then(res => res.json())
            .then(users => {
                if (users.length > 0) {
                    viewUserProfile(users[0].id);
                }
            });
        }

        function formatTime(timestamp) {
            const date = new Date(timestamp);
            const now = new Date();
            const diff = now - date;
            
            if (diff < 60000) return 'Just now';
            if (diff < 3600000) return Math.floor(diff / 60000) + 'm ago';
            if (diff < 86400000) return date.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
            return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
        }

        function scrollToBottom() {
            const container = document.getElementById('messagesArea');
            container.scrollTop = container.scrollHeight;
        }

        // File handling
        document.getElementById('fileInput').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                selectedFile = file;
                showFilePreview(file);
            }
        });

        function showFilePreview(file) {
            const preview = document.getElementById('filePreview');
            const isImage = file.type.startsWith('image/');
            const isVideo = file.type.startsWith('video/');

            const reader = new FileReader();
            reader.onload = (e) => {
                preview.innerHTML = `
                    <div class="preview-item">
                        ${isImage ? `<img src="${e.target.result}" class="preview-thumbnail">` : ''}
                        ${isVideo ? `<video src="${e.target.result}" class="preview-thumbnail"></video>` : ''}
                        <div class="preview-info">
                            <div style="font-weight: 600;">${file.name}</div>
                            <div style="font-size: 12px; color: #6b7280;">${(file.size / 1024 / 1024).toFixed(2)} MB</div>
                        </div>
                        <button class="remove-file-btn" onclick="removeFile()">Remove</button>
                    </div>
                `;
                preview.classList.add('show');
            };
            reader.readAsDataURL(file);
        }

        function removeFile() {
            selectedFile = null;
            document.getElementById('fileInput').value = '';
            document.getElementById('filePreview').classList.remove('show');
        }

        // Send message
        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const content = input.value.trim();
            
            if (!content && !selectedFile) return;

            const sendBtn = document.getElementById('sendBtn');
            sendBtn.disabled = true;

            try {
                const formData = new FormData();
                formData.append('recipient_id', partner.id);
                formData.append('content', content);
                if (selectedFile) {
                    formData.append('file', selectedFile);
                }

                const res = await fetch(`${API_URL}/chat/send`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` },
                    body: formData
                });

                const data = await res.json();
                if (data.success) {
                    input.value = '';
                    removeFile();
                    await loadMessages();
                }
            } catch (err) {
                console.error('Send error:', err);
                alert('Failed to send message');
            } finally {
                sendBtn.disabled = false;
            }
        }

        // Enter to send
        document.getElementById('messageInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // Auto-resize textarea
        document.getElementById('messageInput').addEventListener('input', (e) => {
            e.target.style.height = 'auto';
            e.target.style.height = Math.min(e.target.scrollHeight, 120) + 'px';
        });

        // Poll for new messages
        function startMessagePolling() {
            setInterval(loadMessages, 3000);
        }

        function viewProfile() {
            localStorage.setItem('viewUserProfile', partner.id);
            window.location.href = 'userprofile.html';
        }

        function viewUserProfile(userId) {
            localStorage.setItem('viewUserProfile', userId);
            window.location.href = 'userprofile.html';
        }

        init();
    </script>
</body>
</html>
